<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Structural Analysis Studio</title>
    
    <!-- Preload for fast loading -->
    <link rel="preload" href="frontend/shared/theme/themes.css" as="style">
    <link rel="preload" href="frontend/desktop/css/main.css" as="style">
    <link rel="preload" href="frontend/mobile/css/main.css" as="style">
    
    <!-- Core Themes -->
    <link rel="stylesheet" href="frontend/shared/theme/themes.css">
    <link rel="stylesheet" href="frontend/desktop/css/main.css">
    <link rel="stylesheet" href="frontend/mobile/css/main.css">
</head>
<body>

    <!-- SYNCHRONOUS HTML INJECTION -->
    <!-- This forces the browser to pause, fetch the HTML, and inject it into the DOM -->
    <!-- BEFORE moving on. This mathematically guarantees your canvas exists before JS runs. -->
    <script>
        function loadHTMLSync(url) {
            var xhr = new XMLHttpRequest();
            // The 'false' parameter makes the request Synchronous (blocking)
            xhr.open('GET', url, false); 
            xhr.send(null);
            
            if (xhr.status === 200 || xhr.status === 0) {
                document.write(xhr.responseText);
            } else {
                console.error("Failed to load layout:", url);
            }
        }
        
        // Inject layouts directly into the body
        loadHTMLSync('frontend/desktop/layout.html');
        loadHTMLSync('frontend/mobile/layout.html');
    </script>

    <!-- NATIVE MODULE SCRIPTS -->
    <!-- Because the HTML was injected synchronously above, these scripts will now -->
    <!-- behave exactly as they did in your original monolithic file. -->
    <script type="module" defer src="frontend/desktop/layout.js"></script>
    <script type="module" defer src="frontend/mobile/layout.js"></script>

    <!-- INLINE EVENT LISTENERS (Original UI Logic) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Bottom Panel Tab Switching logic
            const bpTabs = document.querySelectorAll('.bp-tab');
            bpTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    bpTabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Workspace Tab Switching logic
            const wsTabs = document.querySelectorAll('.workspace-tabs .tab');
            wsTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    if (e.target.classList.contains('disabled-phase')) return;
                    wsTabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Ribbon active state logic
            const ribbonBtns = document.querySelectorAll('.ribbon-btn');
            ribbonBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const group = e.target.closest('.ribbon-group');
                    if (!group) return;
                    group.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('active'));
                    e.target.closest('.ribbon-btn')?.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
