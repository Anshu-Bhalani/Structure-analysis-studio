<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Structural Analysis Studio</title>
    
    <!-- Preload for fast loading -->
    <link rel="preload" href="frontend/shared/theme/themes.css" as="style">
    <link rel="preload" href="frontend/desktop/css/main.css" as="style">
    <link rel="preload" href="frontend/mobile/css/main.css" as="style">
    
    <!-- Core Themes -->
    <link rel="stylesheet" href="frontend/shared/theme/themes.css">
    <link rel="stylesheet" href="frontend/desktop/css/main.css">
    <link rel="stylesheet" href="frontend/mobile/css/main.css">
</head>
<body>

    <!-- Mount points for layout components -->
    <div id="desktop-view-container"></div>
    <div id="mobile-view-container"></div>

    <script>
        // Helper function to load modules and explicitly WAIT until they are ready
        function loadModule(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        async function bootstrapApplication() {
            try {
                // 1. Fetch HTML components concurrently (Pauses execution until done)
                const [desktopRes, mobileRes] = await Promise.all([
                    fetch('frontend/desktop/layout.html'),
                    fetch('frontend/mobile/layout.html')
                ]);

                // 2. Inject HTML into the DOM so the Canvas actually exists
                document.getElementById('desktop-view-container').innerHTML = await desktopRes.text();
                document.getElementById('mobile-view-container').innerHTML = await mobileRes.text();

                // 3. Initialize the inline UI interactions (Tabs, Ribbon)
                initInteractions();

                // 4. Load the JavaScript modules strictly AFTER HTML is injected
                // We use await to guarantee they finish evaluating before moving on.
                await loadModule('frontend/desktop/layout.js');
                await loadModule('frontend/mobile/layout.js');

                // 5. Fire DOMContentLoaded synthetically
                // Because we fetched HTML asynchronously, the browser's native event 
                // already fired on an empty page. This tells layout.js to wake up 
                // and bind the Node/Beam tools to the newly loaded canvas.
                document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
                window.dispatchEvent(new Event('load'));

            } catch (error) {
                console.error("Error booting application:", error);
            }
        }

        function initInteractions() {
            // Bottom Panel Tab Switching
            const bpTabs = document.querySelectorAll('.bp-tab');
            bpTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    bpTabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Workspace Tab Switching
            const wsTabs = document.querySelectorAll('.workspace-tabs .tab');
            wsTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    if (e.target.classList.contains('disabled-phase')) return;
                    wsTabs.forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            // Ribbon Active States
            const ribbonBtns = document.querySelectorAll('.ribbon-btn');
            ribbonBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const group = e.target.closest('.ribbon-group');
                    if (!group) return;
                    group.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('active'));
                    e.target.closest('.ribbon-btn')?.classList.add('active');
                });
            });
        }

        // Start the boot sequence immediately
        bootstrapApplication();
    </script>
</body>
</html>
