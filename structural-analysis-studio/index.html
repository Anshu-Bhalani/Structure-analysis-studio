<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Structural Analysis Studio</title>
    
    <!-- Preload for fast loading -->
    <link rel="preload" href="frontend/shared/theme/theme.css" as="style">
    <link rel="preload" href="frontend/desktop/css/main.css" as="style">
    <link rel="preload" href="frontend/mobile/css/main.css" as="style">
    
    <!-- Core Themes -->
    <link rel="stylesheet" href="frontend/shared/theme/theme.css">
    <link rel="stylesheet" href="frontend/desktop/css/main.css">
    <link rel="stylesheet" href="frontend/mobile/css/main.css">
</head>
<body>

    <!-- Desktop and mobile view components, loaded from external HTML files.
         These loaders run as module scripts (document order, before
         DOMContentLoaded) so the markup they inject is in the DOM before
         frontend/desktop/layout.js and frontend/mobile/layout.js query it,
         exactly as when this markup was inlined here directly. -->
    <script type="module" src="frontend/desktop/layout-loader.js"></script>
    <script type="module" src="frontend/mobile/layout-loader.js"></script>

    <!-- Scripts deferred so they don't block loading -->
    <script type="module" defer src="frontend/desktop/layout.js"></script>
    <script type="module" defer src="frontend/mobile/layout.js"></script>

    <!-- FIX: Added small global connector to hook the HTML buttons to the App -->
    <script>
  document.addEventListener("DOMContentLoaded", () => {
    // Bottom Panel Tab Switching logic
    const bpTabs = document.querySelectorAll('.bp-tab');
    bpTabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        bpTabs.forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
      });
    });

    // Workspace Tab Switching logic
    const wsTabs = document.querySelectorAll('.workspace-tabs .tab');
    wsTabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        if (e.target.classList.contains('disabled-phase')) return;
        wsTabs.forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
      });
    });

    // Ribbon active state logic
    const ribbonBtns = document.querySelectorAll('.ribbon-btn');
    ribbonBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const group = e.target.closest('.ribbon-group');
        if (!group) return;
        group.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('active'));
        e.target.closest('.ribbon-btn')?.classList.add('active');
      });
    });

    
</script>
</body>
</html>
