<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Structural Analysis Studio</title>

    <!-- Preload for fast loading -->
    <link rel="preload" href="frontend/shared/theme/theme.css" as="style">
    <link rel="preload" href="frontend/desktop/css/main.css" as="style">
    <link rel="preload" href="frontend/mobile/css/main.css" as="style">

    <!-- Core Themes -->
    <link rel="stylesheet" href="frontend/shared/theme/theme.css">
    <link rel="stylesheet" href="frontend/desktop/css/main.css">
    <link rel="stylesheet" href="frontend/mobile/css/main.css">
</head>
<body>
    <div id="desktop-view"></div>
    <div id="mobile-view"></div>

    <script type="module">
        const loadFragment = async (mountId, url) => {
            const mount = document.getElementById(mountId);
            if (!mount) return;

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to load ${url}: ${response.status}`);
            }

            mount.innerHTML = await response.text();
        };

        await Promise.all([
            loadFragment('desktop-view', './frontend/desktop/layout.html'),
            loadFragment('mobile-view', './frontend/mobile/layout.html')
        ]);

        await import('./frontend/desktop/layout.js');
        await import('./frontend/mobile/layout.js');
    </script>
</body>
</html>
