<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Validation Test Harness</title>
    <style>
        body { font-family: monospace; background: #121212; color: #fff; padding: 20px; }
        .success { color: #22c55e; margin-bottom: 15px; }
        .error { color: #ef4444; margin-bottom: 5px; border-left: 2px solid #ef4444; padding-left: 10px; }
        .test-case { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #333; }
        h3 { margin-top: 0; color: #3b82f6; }
    </style>
</head>
<body>
    <h2>Phase 3: Validation Engine - Load Testing</h2>
    <div id="output"></div>

    <script type="module">
        import { Model } from './core/modeling/Model.js';
        import { Node } from './core/modeling/Node.js';
        import { Element } from './core/modeling/Element.js';
        import { Load } from './core/modeling/Load.js';
        import { Validator } from './core/utilities/Validation.js';

        const output = document.getElementById('output');

        function runTest(testName, loadConfig) {
            const model = new Model("Test Model");
            model.addNode(new Node("N1", 0, 0));
            model.addNode(new Node("N2", 10, 0));
            
            // Basic valid element (length = 10)
            const e1 = new Element("E1", "N1", "N2", "beam");
            e1.material = "Steel"; e1.section = "W8x31";
            model.addElement(e1);

            model.addLoad(new Load("L1", loadConfig));

            const report = Validator.validateLoads(model);
            
            const div = document.createElement('div');
            div.className = 'test-case';
            
            let html = `<h3>${testName}</h3>`;
            if (report.valid) {
                html += `<div class="success">✔ Passed Validation</div>`;
            } else {
                report.errors.forEach(err => { html += `<div class="error">✖ ${err}</div>`; });
            }
            div.innerHTML = html;
            output.appendChild(div);
        }

        // --- The 13 Test Cases ---
        runTest("1. Valid point load", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'FY', magnitude: -50 });
        runTest("2. Node load referencing node 999", { targetType: 'node', target: 'N999', loadType: 'Point Load', direction: 'FY', magnitude: -50 });
        runTest("3. Element load referencing element 999", { targetType: 'element', target: 'E999', loadType: 'Uniform Load', direction: 'Local-Y', magnitude: -10 });
        runTest("4. Magnitude = NaN", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'FY', magnitude: NaN });
        runTest("5. Magnitude = Infinity", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'FY', magnitude: Infinity });
        runTest("6. Invalid direction", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'DIAGONAL', magnitude: 100 });
        runTest("7. Unsupported load type", { targetType: 'node', target: 'N1', loadType: 'Magic Load', direction: 'FY', magnitude: 100 });
        runTest("8. Position outside element", { targetType: 'element', target: 'E1', loadType: 'Point Load', direction: 'FY', magnitude: -50, position: 15 }); // Length is 10
        runTest("9. startPosition > endPosition", { targetType: 'element', target: 'E1', loadType: 'Uniform Load', direction: 'FY', magnitude: -10, startPosition: 8, endPosition: 2 });
        runTest("10. Missing target", { targetType: 'node', loadType: 'Point Load', direction: 'FY', magnitude: 50 });
        runTest("11. Missing magnitude", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'FY' });
        runTest("12. Missing direction", { targetType: 'node', target: 'N1', loadType: 'Point Load', magnitude: 50 });
        runTest("13. Missing type", { targetType: 'node', target: 'N1', direction: 'FY', magnitude: 50 });

    </script>
</body>
</html>
