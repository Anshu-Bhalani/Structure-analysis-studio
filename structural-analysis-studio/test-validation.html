<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3: Validation Pipeline</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .btn-clear { background: #ef4444; } .btn-clear:hover { background: #dc2626; }
        #output { background: #1e1e1e; padding: 20px; border-radius: 6px; border: 1px solid #333; min-height: 200px; }
        .success { color: #22c55e; font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
        .error { color: #ef4444; margin-bottom: 8px; border-left: 3px solid #ef4444; padding-left: 10px; }
        .warning { color: #f59e0b; margin-bottom: 8px; border-left: 3px solid #f59e0b; padding-left: 10px; }
        h3 { margin-top: 0; color: #60a5fa; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Phase 3: Validation Engine Dashboard</h2>
    
    <div class="controls" id="btn-container">
        <!-- Buttons will be injected here after JS loads -->
    </div>
    
    <div id="output">Initialize the model to begin...</div>

    <script type="module">
        const output = document.getElementById('output');
        const controls = document.getElementById('btn-container');

        async function init() {
            try {
                const { Model } = await import('./core/modeling/Model.js');
                const { Node } = await import('./core/modeling/Node.js');
                const { Element } = await import('./core/modeling/Element.js');
                const { Material } = await import('./core/modeling/Material.js');
                const { Section } = await import('./core/modeling/Section.js');
                const { Support } = await import('./core/modeling/Support.js');
                const { Load } = await import('./core/modeling/Load.js');
                const { Validator } = await import('./core/utilities/Validation.js');

                // --- Helper: Creates a 100% perfect model as a baseline for every test ---
                function getPerfectModel() {
                    const m = new Model("Active Model");
                    m.addNode(new Node("N1", 0, 0));
                    m.addNode(new Node("N2", 10, 0));
                    m.materials.set("Steel01", new Material("Steel01"));
                    m.sections.set("ISMB300", new Section("ISMB300"));
                    
                    const beam = new Element("E1", "N1", "N2", "beam");
                    beam.material = "Steel01"; 
                    beam.section = "ISMB300";
                    m.addElement(beam);

                    const support = new Support("S1", "N1", "Fixed");
                    support.restrainedDOFs = { dx: true, dy: true, mz: true };
                    m.addSupport(support);
                    
                    return m;
                }

                // --- Helper: Runs the engine and prints to screen ---
                function runValidation(testName, modelToTest) {
                    try {
                        const report = Validator.validateModel(modelToTest);
                        let html = `<h3>Test: ${testName}</h3>`;
                        
                        if (report.valid) {
                            html += `<div class="success">✔ Validation Passed! Model is mathematically sound.</div>`;
                        } else {
                            html += `<div class="error" style="border:none; font-weight:bold; font-size:1.2em; padding:0;">✖ Validation Engine Blocked the Model!</div>`;
                            report.errors.forEach(err => { html += `<div class="error">${err}</div>`; });
                        }
                        
                        report.warnings.forEach(warn => { html += `<div class="warning">Warning: ${warn}</div>`; });
                        output.innerHTML = html;
                    } catch (e) {
                        output.innerHTML = `<h3>Test: ${testName}</h3><div class="error">🔥 CRASH: ${e.message}</div>`;
                    }
                }

                // ==========================================
                // TEST CASES (Each starts perfect, then gets sabotaged)
                // ==========================================
                
                window.testValidModel = () => {
                    const model = getPerfectModel();
                    runValidation("Perfect Model", model);
                };

                window.testEmptyModel = () => {
                    const model = new Model("Empty"); // No nodes, no elements
                    runValidation("Completely Empty Model", model);
                };

                window.testCoincidentNode = () => {
                    const model = getPerfectModel();
                    // Sabotage: Add a node exactly on top of an existing node (N1 is at 0,0)
                    model.addNode(new Node("N3", 0, 0)); 
                    runValidation("Coincident Node Test", model);
                };

                window.testBadElement = () => {
                    const model = getPerfectModel();
                    // Sabotage: Add an element pointing to nodes that don't exist
                    const badBeam = new Element("BadE", "GhostNode1", "GhostNode2", "beam");
                    badBeam.material = "FakeMaterial"; // Missing material reference
                    model.addElement(badBeam);
                    runValidation("Dangling Element & Missing Material Test", model);
                };

                window.testBadSupport = () => {
                    const model = getPerfectModel();
                    // Sabotage: Add a support with strings instead of booleans
                    const badSupport = new Support("BadS", "N2", "Pin");
                    badSupport.restrainedDOFs = { dx: "yes", dy: "no", mz: false }; 
                    model.addSupport(badSupport);
                    runValidation("Malformed Support Restraints Test", model);
                };

                window.testBadLoad = () => {
                    const model = getPerfectModel();
                    // Sabotage: Add a load with an unsupported direction
                    model.addLoad(new Load("BadL", { targetType: 'node', target: 'N1', loadType: 'Point Load', direction: 'DIAGONAL', magnitude: 100 }));
                    runValidation("Invalid Load Direction Test", model);
                };

                // --- Inject Buttons into the UI ---
                controls.innerHTML = `
                    <button onclick="testValidModel()">1. Test Valid Model</button>
                    <button class="btn-clear" onclick="testEmptyModel()">2. Test Empty Model</button>
                    <button onclick="testCoincidentNode()">3. Test Coincident Node</button>
                    <button onclick="testBadElement()">4. Test Bad Element</button>
                    <button onclick="testBadSupport()">5. Test Bad Support</button>
                    <button onclick="testBadLoad()">6. Test Bad Load</button>
                `;

                // Run the valid test on startup automatically
                window.testValidModel();

            } catch (err) {
                output.innerHTML = `<div class="error">Setup Error: ${err.message}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
